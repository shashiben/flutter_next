<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Next Animation - Comprehensive Flutter Animation Package Documentation">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Next Animation Docs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Next Animation Documentation</title>
  <link rel="manifest" href="manifest.json">
  <script>
    var serviceWorkerVersion = null;
    var serviceWorkerUrl = 'flutter_service_worker.js?v=' + serviceWorkerVersion;
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register(serviceWorkerUrl)
          .then((reg) => {
            function updateServiceWorker(isUpdate) {
              if (!isUpdate) {
                return;
              }
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
            }
            reg.addEventListener('updatefound', () => {
              updateServiceWorker(reg.installing);
            });
            updateServiceWorker(reg.waiting);
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              window.location.reload();
            });
          });
      });
    }
  </script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</head>
<body>
  <script src="flutter.js" defer></script>
</body>
</html>
