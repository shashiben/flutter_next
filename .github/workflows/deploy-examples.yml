name: Deploy Example Shared to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'flutter_next/**'
      - 'animation_next/**'
      - 'example_shared/**'
      - '.github/workflows/deploy-examples.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-examples"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd example_shared
          flutter pub get

      - name: Build Example Shared
        run: |
          cd example_shared
          flutter build web --base-href "/" --release
        continue-on-error: false

      - name: Verify build
        run: |
          if [ ! -d "example_shared/build/web" ]; then
            echo "Error: Example Shared build directory not found"
            exit 1
          fi
          echo "✓ Build completed successfully"

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r example_shared/build/web/* deploy/
          echo "✓ Deployment directory prepared"
          ls -la deploy/

      - name: Create 404.html for client-side routing
        run: |
          # Copy index.html to 404.html for GitHub Pages routing support
          # GitHub Pages will serve 404.html for any route that doesn't exist
          # This allows Flutter's client-side routing to work properly
          cp deploy/index.html deploy/404.html
          echo "✓ Created 404.html for client-side routing support"

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
